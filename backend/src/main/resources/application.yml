server:
  port: 8080

spring:
  application:
    name: payroll-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payroll_db}
    username: ${DB_USER:payroll_mapalo}
    password: ${DB_PASSWORD:mapalo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    date-format: yyyy-MM-dd
    time-zone: Africa/Lusaka

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  resend:
    api-key: ${RESEND_API_KEY:re_MA6LxTYU_FgRTU1U39N6dBtxpBL7mYznS}
    from-address: ${RESEND_FROM_ADDRESS:no-reply@mesltd.co.zm}
  base-url: ${APP_BASE_URL:https://api.mesltd.co.zm}
  frontend-url: ${APP_FRONTEND_URL:https://payroll.mesltd.co.zm}
  admin-email: ${ADMIN_EMAIL:kellieschikumbi98@gmail.com}
  payslip-storage: ${PAYSLIP_STORAGE:./payslips}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.payroll: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
